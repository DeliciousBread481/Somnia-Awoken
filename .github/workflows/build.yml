name: Build

on:
  push:
    branches: [ "1.20.1-test" ]
  pull_request:
    branches: [ "1.20.1-test" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # gitVersioning 插件依赖 git tag 生成版本号，需要完整历史
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: somnia-awoken-jars
          path: build/libs/*.jar
          if-no-found: warn
          retention-days: 30